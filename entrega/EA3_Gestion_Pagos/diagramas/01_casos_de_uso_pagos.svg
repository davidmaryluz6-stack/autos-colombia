<text x="595" y="350" text-anchor="start" font-size="12" font-weight="400" fill="#203a47" ><tspan x="595" dy="0">Restricción transversal</tspan><tspan x="595" dy="15">(no es un caso de uso):</tspan><tspan x="595" dy="15">toda operación exige sesión activa</tspan><tspan x="595" dy="15">(cookie HttpOnly) y rol ADMIN u</tspan><tspan x="595" dy="15">OPERADOR; solo ADMIN anula.</tspan><tspan x="595" dy="15">Implementada por requiereSesion</tspan><tspan x="595" dy="15">y requiereRol en app.js.</tspan></text>
