<text x="595" y="515" text-anchor="start" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="595" dy="0">«extend» CU3-03 → CU3-02: al elegir un</tspan><tspan x="595" dy="15">pago del historial; también se muestra</tspan><tspan x="595" dy="15">tras registrar. Los pagos no modifican la</tspan><tspan x="595" dy="15">vigencia del vehículo ni bloquean entradas.</tspan></text>
