<text x="616" y="632" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="616" dy="0">21. UPDATE estado=ANULADO + auditoría</tspan></text>
<rect x="20" y="659" width="760" height="24" rx="4" fill="#e8eef7" stroke="none" stroke-width="1.5" />
