<text x="405" y="584" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">20. POST /api/pagos/{id}/anular</tspan><tspan x="405" dy="14">(motivo)  · solo ADMIN, si no 403</tspan></text>
