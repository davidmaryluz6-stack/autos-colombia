<text x="616" y="385" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="616" dy="0">16. registrarPago(): BEGIN, FOR UPDATE,</tspan><tspan x="616" dy="14">verificar duplicados, INSERT pagos,</tspan><tspan x="616" dy="14">INSERT auditoría, COMMIT</tspan></text>
