<text x="90" y="65" text-anchor="middle" font-size="12" font-weight="400" fill="#fff" ><tspan x="90" dy="0">Usuario</tspan><tspan x="90" dy="14">(OPERADOR / ADMIN)</tspan></text>
<rect x="212" y="44" width="156" height="46" rx="6" fill="#063b54" stroke="#063b54" stroke-width="1.5" />
<text x="290" y="65" text-anchor="middle" font-size="12" font-weight="400" fill="#fff" ><tspan x="290" dy="0">Frontend Vue 3</tspan><tspan x="290" dy="14">(App.vue · api.js)</tspan></text>
<rect x="442" y="44" width="156" height="46" rx="6" fill="#063b54" stroke="#063b54" stroke-width="1.5" />
<text x="520" y="65" text-anchor="middle" font-size="12" font-weight="400" fill="#fff" ><tspan x="520" dy="0">API Express</tspan><tspan x="520" dy="14">(app.js · validation.js)</tspan></text>
<rect x="634" y="44" width="156" height="46" rx="6" fill="#063b54" stroke="#063b54" stroke-width="1.5" />
<text x="712" y="65" text-anchor="middle" font-size="12" font-weight="400" fill="#fff" ><tspan x="712" dy="0">repository.js</tspan><tspan x="712" dy="14">+ MySQL 8</tspan></text>
<line x1="90" y1="90" x2="90" y2="1371" stroke="#8da2ae" stroke-width="1" stroke-dasharray="6 4" />
