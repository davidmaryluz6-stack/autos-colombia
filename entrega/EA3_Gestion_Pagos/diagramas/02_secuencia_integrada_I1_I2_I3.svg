<text x="30" y="136" text-anchor="start" font-size="12.5" font-weight="700" fill="#063b54" ><tspan x="30" dy="0">ITERACIÓN 1 · Acceso seguro</tspan></text>
<line x1="90" y1="176" x2="290" y2="176" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="190" y="169" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="190" dy="0">1. Usuario y contraseña</tspan></text>
<line x1="290" y1="210" x2="520" y2="210" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="405" y="203" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">2. POST /api/auth/login</tspan></text>
<line x1="520" y1="244" x2="712" y2="244" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="616" y="237" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="616" dy="0">3. obtenerUsuario + bcrypt</tspan></text>
