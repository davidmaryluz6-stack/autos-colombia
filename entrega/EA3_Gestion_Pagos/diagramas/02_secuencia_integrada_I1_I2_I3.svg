</defs>
<rect width="800" height="1391" fill="#fff"/>
<text x="400" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#203a47" ><tspan x="400" dy="0">Diagrama de secuencia integrado · Iteraciones 1, 2 y 3</tspan></text>
