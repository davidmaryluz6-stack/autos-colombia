<text x="566" y="386" text-anchor="start" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="566" dy="0">requiereRol(ADMIN) + validar</tspan></text>
<line x1="520" y1="436" x2="712" y2="436" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="616" y="429" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="616" dy="0">6. INSERT cliente/celda + auditoría</tspan></text>
<rect x="20" y="456" width="760" height="24" rx="4" fill="#e8eef7" stroke="none" stroke-width="1.5" />
<text x="30" y="472" text-anchor="start" font-size="12.5" font-weight="700" fill="#063b54" ><tspan x="30" dy="0">ITERACIÓN 1 · Vehículo y entrada</tspan></text>
<line x1="290" y1="512" x2="520" y2="512" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="405" y="505" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">7. POST /api/vehiculos</tspan></text>
<line x1="520" y1="546" x2="712" y2="546" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="616" y="539" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="616" dy="0">8. INSERT vehiculos + auditoría</tspan></text>
<line x1="290" y1="580" x2="520" y2="580" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="405" y="573" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">9. POST /api/movimientos/entrada</tspan></text>
<line x1="520" y1="614" x2="712" y2="614" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="616" y="607" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="616" dy="0">10. CALL sp_registrar_entrada</tspan></text>
<line x1="712" y1="648" x2="290" y2="648" stroke="#063b54" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="501" y="641" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="501" dy="0">11. Movimiento ACTIVO · celda OCUPADA</tspan></text>
<rect x="20" y="668" width="760" height="24" rx="4" fill="#fff3e0" stroke="none" stroke-width="1.5" />
<text x="30" y="684" text-anchor="start" font-size="12.5" font-weight="700" fill="#063b54" ><tspan x="30" dy="0">ITERACIÓN 3 · Gestión de pagos (nuevo)</tspan></text>
<line x1="290" y1="724" x2="520" y2="724" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="405" y="717" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">12. GET /api/pagos/cartera</tspan></text>
<line x1="520" y1="758" x2="712" y2="758" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="616" y="751" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="616" dy="0">13. Vehículos autorizados sin pago</tspan></text>
<line x1="520" y1="792" x2="290" y2="792" stroke="#063b54" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="405" y="785" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">14. Pendientes por periodo</tspan></text>
<line x1="290" y1="841" x2="520" y2="841" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="405" y="820" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">15. POST /api/pagos (vehículo, periodo,</tspan><tspan x="405" dy="14">valor, método, referencia)</tspan></text>
<path d="M520 882 h38 v22 h-38" fill="none" stroke="#063b54" stroke-width="1.4" marker-end="url(#open)"/>
<text x="566" y="881" text-anchor="start" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="566" dy="0">requiereRol(ADMIN|OPERADOR)</tspan><tspan x="566" dy="14">validarPago()</tspan></text>
<line x1="520" y1="968" x2="712" y2="968" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="616" y="933" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="616" dy="0">16. registrarPago(): BEGIN, FOR UPDATE,</tspan><tspan x="616" dy="14">verificar duplicados, INSERT pagos,</tspan><tspan x="616" dy="14">INSERT auditoría, COMMIT</tspan></text>
<rect x="460" y="984" width="270" height="26" rx="6" fill="#fff" stroke="#b8751a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="595" y="1001" text-anchor="middle" font-size="11" font-weight="700" fill="#b8751a" ><tspan x="595" dy="0">[duplicado o dato inválido] 409/400 con mensaje</tspan></text>
<line x1="520" y1="1036" x2="290" y2="1036" stroke="#063b54" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="405" y="1029" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">17. 201 · comprobante CP-nnnnnn</tspan></text>
<line x1="290" y1="1070" x2="520" y2="1070" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="405" y="1063" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">18. GET /api/pagos/{id}/comprobante</tspan></text>
<line x1="520" y1="1104" x2="290" y2="1104" stroke="#063b54" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="405" y="1097" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">19. Comprobante interno (JSON)</tspan></text>
<line x1="290" y1="1153" x2="520" y2="1153" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="405" y="1132" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">20. POST /api/pagos/{id}/anular</tspan><tspan x="405" dy="14">(motivo)  · solo ADMIN, si no 403</tspan></text>
<line x1="520" y1="1187" x2="712" y2="1187" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="616" y="1180" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="616" dy="0">21. UPDATE estado=ANULADO + auditoría</tspan></text>
<rect x="20" y="1207" width="760" height="24" rx="4" fill="#e8eef7" stroke="none" stroke-width="1.5" />
<text x="30" y="1223" text-anchor="start" font-size="12.5" font-weight="700" fill="#063b54" ><tspan x="30" dy="0">ITERACIÓN 1 · Salida</tspan></text>
<line x1="290" y1="1263" x2="520" y2="1263" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="405" y="1256" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">22. POST /api/movimientos/{id}/salida</tspan></text>
<line x1="520" y1="1297" x2="712" y2="1297" stroke="#063b54" stroke-width="1.5"  marker-end="url(#solid)"/>
<text x="616" y="1290" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="616" dy="0">23. CALL sp_registrar_salida</tspan></text>
<line x1="520" y1="1331" x2="290" y2="1331" stroke="#063b54" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="405" y="1324" text-anchor="middle" font-size="11.5" font-weight="400" fill="#203a47" ><tspan x="405" dy="0">24. Salida registrada · celda libre</tspan></text>
